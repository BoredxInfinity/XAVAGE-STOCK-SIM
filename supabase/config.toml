project_id = "xavage-stock-sim"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Organisers provision every account; nobody signs themselves up.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Must stay TRUE. The CLI maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED, so setting
# it false disables email/password LOGIN as well as signup -- nobody could sign
# in at all. Self-signup is blocked by [auth].enable_signup = false above
# (GOTRUE_DISABLE_SIGNUP), which the admin createUser API deliberately bypasses.
enable_signup = true
# Organiser-provisioned accounts are pre-confirmed; no inbox round-trip.
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false
